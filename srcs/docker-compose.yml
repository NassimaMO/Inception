services:
  nginx:
    container_name: nginx
    image: nginx:inception
    build: ./requirements/nginx
    volumes:
      - wp_volume:/var/www/html:ro
    networks:
      - inception
    ports:
      - "443:443"
    depends_on:
      - wordpress
    env_file:
      - .env
    restart: always
    
  wordpress:
    container_name: wordpress
    image: wordpress:inception
    build: ./requirements/wordpress
    volumes:
      - wp_volume:/var/www/html
    networks:
      - inception
    depends_on:
      - mariadb
    env_file:
      - .env
    secrets:
      - credentials
      - db_password
      - db_root_password
    restart: always

  mariadb:
    container_name: mariadb
    image: mariadb:inception
    build: ./requirements/mariadb
    volumes:
      - db_volume:/var/lib/mysql
    networks:
      - inception
    env_file:
      - .env
    secrets:
      - db_password
      - db_root_password
    restart: always

networks:
  inception:
    driver: bridge

volumes:
  wp_volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/nnassiri/data/wp
  db_volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/nnassiri/data/db

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  credentials:
    file: ../secrets/credentials.txt
